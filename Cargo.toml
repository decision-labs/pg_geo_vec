[package]
name = "pg_geo_vec"
version = "0.1.0"
authors = [
    "Shoaib Burq <saburq@gmail.com>",
    "Decision Labs contributors",
]
edition = "2021"
license = "PostgreSQL"
description = "PostgreSQL extension: composite vector similarity + spatial filtering index"
repository = "https://github.com/decision-labs/pg_geo_vec"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pgrx_embed_pg_geo_vec"
path = "./src/bin/pgrx_embed.rs"

[features]
# Match CI / docs (pg17). Use --features pg18 explicitly for PG18 builds.
default = ["pg17", "build_parallel"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []
build_parallel = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(pgrx_embed)',
    'cfg(pg12)',
] }

[dependencies]
memoffset = "0.9.0"
pgrx = "=0.16.1"
rkyv = { version = "0.7.43", features = ["validation"] }
simdeez = { version = "1.0.8" }
rand = { version = "0.8", features = ["small_rng"] }
pg_geo_vec_derive = { path = "pg_geo_vec_derive" }
semver = "1.0.24"
once_cell = "1.20.1"
lru = "0.14.0"
libc = "0.2"

[dev-dependencies]
pgrx-tests = "=0.16.1"
pgrx-pg-config = "=0.16.1"
criterion = "0.5.1"
tempfile = "3.15.0"

[[bench]]
name = "distance"
harness = false

[[bench]]
name = "lsr"
harness = false
